<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ファミリー スケジュール & タスク</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius-lg: 16px;
      --radius-md: 10px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* --- Header --- */
    header {
      background: var(--card-bg);
      padding: 0.8rem 1.2rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      box-shadow: var(--shadow-sm);
    }
    .header-title-group { display: flex; align-items: center; gap: 0.5rem; }
    h1 { font-size: 1.15rem; font-weight: 700; color: var(--text-main); }
    .btn-icon-gear {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 0.4rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .btn-icon-gear:hover { background: #f1f5f9; color: var(--text-main); }

    /* --- Horizontal Scroll Columns Container --- */
    main { flex: 1; overflow-x: auto; overflow-y: hidden; padding: 1rem; scroll-behavior: smooth; }
    .months-wrapper { display: flex; gap: 1.2rem; height: 100%; min-width: max-content; }

    /* --- Single Month Column --- */
    .month-column {
      width: 320px;
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      height: 100%;
      flex-shrink: 0;
    }
    .month-header {
      padding: 1rem;
      font-size: 1.1rem;
      font-weight: 700;
      text-align: center;
      border-bottom: 2px solid #f1f5f9;
      background: #fafafa;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      color: var(--primary-color);
    }
    .month-body {
      flex: 1;
      overflow-y: auto;
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .no-tasks {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
      margin-top: 2rem;
    }

    /* --- Date Row Inside Column --- */
    .date-group {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #fff;
    }
    .date-header {
      background: #f8fafc;
      padding: 0.4rem 0.6rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: #334155;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .date-header.is-today { background: #eff6ff; color: var(--primary-color); }

    .tasks-list { display: flex; flex-direction: column; }
    .task-item {
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      transition: background 0.15s;
    }
    .task-item:last-child { border-bottom: none; }
    .task-item:hover { background: #f8fafc; }
    
    .task-header-row { display: flex; align-items: center; justify-content: space-between; gap: 0.4rem; margin-bottom: 0.2rem; }
    .task-category-tag {
      font-size: 0.75rem;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-weight: 600;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
    }
    .task-time { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
    .task-title { font-size: 0.9rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.1rem; }
    .task-meta { font-size: 0.75rem; color: var(--text-muted); display: flex; gap: 0.5rem; align-items: center; }
    .task-assignee { background: #f1f5f9; padding: 0.1rem 0.3rem; border-radius: 3px; }

    /* --- Floating Action Button (FAB) --- */
    .fab {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--primary-color);
      color: white;
      font-size: 2rem;
      border: none;
      box-shadow: var(--shadow-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, background 0.2s;
      z-index: 20;
    }
    .fab:hover { transform: scale(1.05); background: var(--primary-hover); }

    /* --- Modals --- */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card-bg);
      width: 90%;
      max-width: 480px;
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header { font-size: 1.15rem; font-weight: 700; margin-bottom: 1.2rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: #334155; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      background: #f8fafc;
    }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary-color); background: #fff; }

    /* --- Quick Select Buttons for Date & Time --- */
    .quick-chips { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.4rem; }
    .chip-btn {
      background: #e2e8f0;
      border: none;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip-btn:hover { background: var(--primary-color); color: #fff; }

    .modal-actions { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1.5rem; }
    .btn { padding: 0.6rem 1.2rem; border-radius: var(--radius-md); border: none; cursor: pointer; font-size: 0.9rem; font-weight: 600; }
    .btn-primary { background: var(--primary-color); color: white; }
    .btn-secondary { background: #f1f5f9; color: #475569; }
  </style>
</head>
<body>

  <header>
    <div class="header-title-group">
      <h1>📅 ファミリー スケジュール</h1>
    </div>
    <!-- シンプルなSVG歯車アイコン -->
    <button class="btn-icon-gear" id="btn-settings" title="設定">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <!-- 横スクロールで月を跨ぐコンテナ -->
  <main id="main-scroll">
    <div class="months-wrapper" id="months-wrapper">
      <!-- JavaScriptで月カラムを生成 -->
    </div>
  </main>

  <!-- タスク追加FABボタン -->
  <button class="fab" id="btn-add">+</button>

  <!-- タスク入力/編集モーダル -->
  <div class="modal" id="task-modal">
    <div class="modal-content">
      <div class="modal-header" id="modal-title">タスクを追加</div>
      <form id="task-form">
        <input type="hidden" id="task-id">
        <div class="form-group">
          <label>タイトル</label>
          <input type="text" id="task-title" placeholder="例: ピアノ送り迎え" required>
        </div>
        <div class="form-group">
          <label>カテゴリー</label>
          <select id="task-category"></select>
        </div>
        
        <!-- 年月日入力 & クイック選択チップ -->
        <div class="form-group">
          <label>年月日</label>
          <input type="date" id="task-date" required>
          <div class="quick-chips">
            <button type="button" class="chip-btn" id="btn-date-yesterday">昨日</button>
            <button type="button" class="chip-btn" id="btn-date-today">今日</button>
            <button type="button" class="chip-btn" id="btn-date-tomorrow">明日</button>
            <button type="button" class="chip-btn" id="btn-date-after-tomorrow">明後日</button>
          </div>
        </div>

        <!-- 時間入力 & 選択チップ -->
        <div class="form-group">
          <label>時間</label>
          <input type="time" id="task-time">
          <div class="quick-chips">
            <button type="button" class="chip-btn" onclick="setTimeVal('')">終日</button>
            <button type="button" class="chip-btn" onclick="setTimeVal('09:00')">09:00</button>
            <button type="button" class="chip-btn" onclick="setTimeVal('12:00')">12:00</button>
            <button type="button" class="chip-btn" onclick="setTimeVal('15:00')">15:00</button>
            <button type="button" class="chip-btn" onclick="setTimeVal('18:00')">18:00</button>
            <button type="button" class="chip-btn" onclick="setTimeVal('20:00')">20:00</button>
          </div>
        </div>

        <div class="form-group">
          <label>担当者</label>
          <input type="text" id="task-assignee" placeholder="例: パパ、ママ、全員">
        </div>
        <div class="form-group">
          <label>メモ</label>
          <textarea id="task-memo" rows="2" placeholder="持ち物や注意事項など"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="btn-modal-close">キャンセル</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div class="modal" id="settings-modal">
    <div class="modal-content">
      <div class="modal-header">API & 設定</div>
      <div class="form-group">
        <label>GAS Web App URL</label>
        <input type="text" id="gas-url" placeholder="[https://script.google.com/macros/s/.../exec](https://script.google.com/macros/s/.../exec)">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="btn-settings-close">閉じる</button>
        <button type="button" class="btn btn-primary" id="btn-settings-save">設定保存</button>
      </div>
    </div>
  </div>

  <script>
    const CONFIG_KEY = 'family_app_config_v2';
    const CACHE_KEY = 'family_app_data_v2';

    // デフォルト絵文字付きカテゴリー定義
    const DEFAULT_CATEGORIES = [
      { name: '🏫 学校・習い事', color: '#2563eb' },
      { name: '🧹 家事・用事', color: '#059669' },
      { name: '🎉 イベント・おでかけ', color: '#d97706' },
      { name: '🏥 病院・健康', color: '#dc2626' },
      { name: '💼 仕事・手続き', color: '#4f46e5' },
      { name: '⭐ その他', color: '#64748b' }
    ];

    let state = {
      gasUrl: localStorage.getItem(CONFIG_KEY) || '',
      tasks: [],
      categories: DEFAULT_CATEGORIES
    };

    document.addEventListener('DOMContentLoaded', () => {
      loadCache();
      setupEventListeners();
      renderMonthColumns();
      fetchData();
    });

    function loadCache() {
      const cached = localStorage.getItem(CACHE_KEY);
      if (cached) {
        const data = JSON.parse(cached);
        state.tasks = data.tasks || [];
        if (data.categories && data.categories.length) state.categories = data.categories;
      }
    }

    function saveCache() {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        tasks: state.tasks,
        categories: state.categories
      }));
    }

    async function fetchData() {
      if (!state.gasUrl) return;
      try {
        const res = await fetch(state.gasUrl);
        const data = await res.json();
        state.tasks = data.tasks || [];
        if (data.categories && data.categories.length) state.categories = data.categories;
        saveCache();
        renderMonthColumns();
      } catch (err) {
        console.warn('オフライン表示中:', err);
      }
    }

    // --- 月別列（1月1列）のレンダリング ---
    function renderMonthColumns() {
      const wrapper = document.getElementById('months-wrapper');
      wrapper.innerHTML = '';

      // 過去12ヶ月〜未来12ヶ月（計25ヶ月）を表示
      const totalPastMonths = 12;
      const totalFutureMonths = 12;
      const now = new Date();
      let currentMonthColumnEl = null;

      for (let i = -totalPastMonths; i <= totalFutureMonths; i++) {
        const targetDate = new Date(now.getFullYear(), now.getMonth() + i, 1);
        const year = targetDate.getFullYear();
        const month = targetDate.getMonth() + 1;
        const yearMonthStr = `${year}-${String(month).padStart(2, '0')}`;

        const colEl = createMonthColumn(year, month, yearMonthStr);
        wrapper.appendChild(colEl);

        if (i === 0) {
          currentMonthColumnEl = colEl;
        }
      }

      // 当月にフォーカススクロール
      if (currentMonthColumnEl) {
        setTimeout(() => {
          currentMonthColumnEl.scrollIntoView({ behavior: 'smooth', inline: 'center' });
        }, 100);
      }
    }

    function createMonthColumn(year, month, yearMonthStr) {
      const col = document.createElement('div');
      col.className = 'month-column';

      const header = document.createElement('div');
      header.className = 'month-header';
      header.textContent = `${year}年 ${month}月`;
      col.appendChild(header);

      const body = document.createElement('div');
      body.className = 'month-body';

      // 当月のタスクを日付順に抽出・ソート
      const monthTasks = state.tasks.filter(t => t.date && t.date.startsWith(yearMonthStr));
      
      if (monthTasks.length === 0) {
        const noTask = document.createElement('div');
        noTask.className = 'no-tasks';
        noTask.textContent = '予定はありません';
        body.appendChild(noTask);
      } else {
        // 日付ごとにグループ化
        const grouped = {};
        monthTasks.forEach(t => {
          if (!grouped[t.date]) grouped[t.date] = [];
          grouped[t.date].push(t);
        });

        // 日付昇順ソート
        const sortedDates = Object.keys(grouped).sort();
        const todayStr = getFormattedDate(new Date());

        sortedDates.forEach(dateStr => {
          const dateGroup = document.createElement('div');
          dateGroup.className = 'date-group';

          const dateObj = new Date(dateStr + 'T00:00:00');
          const dayOfWeek = ['日', '月', '火', '水', '木', '金', '土'][dateObj.getDay()];
          const displayDate = `${dateObj.getMonth() + 1}/${dateObj.getDate()} (${dayOfWeek})`;

          const dateHeader = document.createElement('div');
          dateHeader.className = `date-header ${dateStr === todayStr ? 'is-today' : ''}`;
          dateHeader.innerHTML = `<span>${displayDate}</span>${dateStr === todayStr ? '<span style="font-size:0.7rem; background:#2563eb; color:#fff; padding:1px 4px; border-radius:3px;">今日</span>' : ''}`;
          dateGroup.appendChild(dateHeader);

          const tasksList = document.createElement('div');
          tasksList.className = 'tasks-list';

          // 時間昇順でソート
          grouped[dateStr].sort((a, b) => (a.time || '23:59').localeCompare(b.time || '23:59'));

          grouped[dateStr].forEach(task => {
            const cat = state.categories.find(c => c.name === task.category) || { color: '#64748b', name: task.category || '未設定' };
            const item = document.createElement('div');
            item.className = 'task-item';
            item.onclick = () => openEditModal(task);

            item.innerHTML = `
              <div class="task-header-row">
                <span class="task-category-tag" style="background-color:${cat.color}">${cat.name}</span>
                <span class="task-time">${task.time || '終日'}</span>
              </div>
              <div class="task-title">${escapeHtml(task.title)}</div>
              ${task.assignee || task.memo ? `
                <div class="task-meta">
                  ${task.assignee ? `<span class="task-assignee">👤 ${escapeHtml(task.assignee)}</span>` : ''}
                  ${task.memo ? `<span>📝 ${escapeHtml(task.memo)}</span>` : ''}
                </div>
              ` : ''}
            `;
            tasksList.appendChild(item);
          });

          dateGroup.appendChild(tasksList);
          body.appendChild(dateGroup);
        });
      }

      col.appendChild(body);
      return col;
    }

    // --- イベント設定 & 日付操作 ---
    function setupEventListeners() {
      document.getElementById('btn-add').onclick = () => openEditModal();
      document.getElementById('btn-modal-close').onclick = () => closeModal('task-modal');
      document.getElementById('btn-settings').onclick = () => {
        document.getElementById('gas-url').value = state.gasUrl;
        openModal('settings-modal');
      };
      document.getElementById('btn-settings-close').onclick = () => closeModal('settings-modal');

      document.getElementById('btn-settings-save').onclick = () => {
        state.gasUrl = document.getElementById('gas-url').value.trim();
        localStorage.setItem(CONFIG_KEY, state.gasUrl);
        closeModal('settings-modal');
        fetchData();
      };

      // クイック日付ボタン
      document.getElementById('btn-date-yesterday').onclick = () => setOffsetDate(-1);
      document.getElementById('btn-date-today').onclick = () => setOffsetDate(0);
      document.getElementById('btn-date-tomorrow').onclick = () => setOffsetDate(1);
      document.getElementById('btn-date-after-tomorrow').onclick = () => setOffsetDate(2);

      // フォーム送信
      document.getElementById('task-form').onsubmit = async (e) => {
        e.preventDefault();
        const taskData = {
          id: document.getElementById('task-id').value || null,
          title: document.getElementById('task-title').value,
          category: document.getElementById('task-category').value,
          date: document.getElementById('task-date').value,
          time: document.getElementById('task-time').value,
          assignee: document.getElementById('task-assignee').value,
          memo: document.getElementById('task-memo').value
        };

        if (taskData.id) {
          const idx = state.tasks.findIndex(t => t.id === taskData.id);
          if (idx !== -1) state.tasks[idx] = taskData;
        } else {
          taskData.id = 'temp-' + Date.now();
          state.tasks.push(taskData);
        }

        saveCache();
        renderMonthColumns();
        closeModal('task-modal');

        if (state.gasUrl) {
          try {
            await fetch(state.gasUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'saveTask', ...taskData })
            });
          } catch (err) {
            console.error('GAS同期失敗:', err);
          }
        }
      };
    }

    function setOffsetDate(offsetDays) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      document.getElementById('task-date').value = getFormattedDate(d);
    }

    function setTimeVal(val) {
      document.getElementById('task-time').value = val;
    }

    function getFormattedDate(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function populateCategories() {
      const select = document.getElementById('task-category');
      select.innerHTML = state.categories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
    }

    function openEditModal(task = null) {
      populateCategories();
      if (task) {
        document.getElementById('modal-title').textContent = 'タスクを編集';
        document.getElementById('task-id').value = task.id;
        document.getElementById('task-title').value = task.title;
        document.getElementById('task-category').value = task.category;
        document.getElementById('task-date').value = task.date;
        document.getElementById('task-time').value = task.time || '';
        document.getElementById('task-assignee').value = task.assignee || '';
        document.getElementById('task-memo').value = task.memo || '';
      } else {
        document.getElementById('modal-title').textContent = 'タスクを追加';
        document.getElementById('task-form').reset();
        document.getElementById('task-id').value = '';
        setOffsetDate(0); // デフォルトで今日
      }
      openModal('task-modal');
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }
  </script>
</body>
</html>
